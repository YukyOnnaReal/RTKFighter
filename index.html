<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTK: The Fury of the Last Lecturer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@400;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Teko', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(200, 0, 0, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 0, 200, 0.1) 0%, transparent 20%);
        }

        .game-container {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Эффект сканирования (старая аркада) */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            z-index: 1;
            pointer-events: none;
        }

        .title-container {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-size: 5rem;
            color: #ffcc00;
            text-shadow: 
                0 0 5px #ff9900,
                0 0 10px #ff3300,
                0 0 15px #ff0000,
                0 0 20px #990000;
            letter-spacing: 8px;
            text-transform: uppercase;
            line-height: 1;
            animation: flicker 3s infinite alternate;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 2.5rem;
            color: #ff3333;
            text-shadow: 0 0 10px #ff0000;
            letter-spacing: 4px;
        }

        /* Кнопка играть */
        .play-button {
            position: relative;
            z-index: 2;
            background: transparent;
            border: 3px solid #ff9900;
            color: #ffcc00;
            font-size: 2.5rem;
            font-family: 'Teko', sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 15px 60px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 0 15px rgba(255, 153, 0, 0.5),
                inset 0 0 15px rgba(255, 153, 0, 0.2);
            overflow: hidden;
        }

        .play-button:hover {
            background-color: rgba(255, 153, 0, 0.1);
            transform: scale(1.05);
            box-shadow: 
                0 0 25px rgba(255, 153, 0, 0.8),
                inset 0 0 20px rgba(255, 153, 0, 0.3);
            text-shadow: 0 0 10px #ff9900;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .play-button:hover::before {
            left: 100%;
        }

        /* Огни внизу */
        .flames {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            z-index: 1;
            background: linear-gradient(to top, rgba(255, 100, 0, 0.7) 0%, rgba(255, 50, 0, 0.3) 30%, transparent 70%);
            opacity: 0.7;
        }

        .flame {
            position: absolute;
            bottom: 0;
            width: 40px;
            height: 60px;
            background: radial-gradient(ellipse at center, rgba(255, 200, 0, 0.9) 0%, rgba(255, 100, 0, 0.7) 40%, rgba(255, 0, 0, 0) 70%);
            border-radius: 50% 50% 20% 20%;
            animation: flame-flicker 1.5s infinite alternate;
        }

        .flame-1 {
            left: 15%;
            animation-delay: 0s;
        }

        .flame-2 {
            left: 30%;
            animation-delay: 0.3s;
        }

        .flame-3 {
            right: 30%;
            animation-delay: 0.6s;
        }

        .flame-4 {
            right: 15%;
            animation-delay: 0.9s;
        }

        /* Подвал */
        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            letter-spacing: 1px;
            z-index: 2;
        }

        .highlight {
            color: #ffcc00;
            animation: pulse 2s infinite;
        }

        /* Анимации */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 
                    0 0 5px #ff9900,
                    0 0 10px #ff3300,
                    0 0 15px #ff0000,
                    0 0 20px #990000;
            }
            20%, 24%, 55% {
                text-shadow: 
                    0 0 2px #ff9900,
                    0 0 5px #ff3300,
                    0 0 7px #ff0000,
                    0 0 9px #990000;
            }
        }

        @keyframes flame-flicker {
            0%, 100% {
                height: 60px;
                opacity: 0.8;
            }
            50% {
                height: 70px;
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .main-title {
                font-size: 3.5rem;
                letter-spacing: 5px;
            }
            
            .subtitle {
                font-size: 2rem;
                letter-spacing: 3px;
            }
            
            .play-button {
                font-size: 2rem;
                padding: 12px 40px;
            }
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }
            
            .subtitle {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }
            
            .play-button {
                font-size: 1.8rem;
                padding: 10px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Эффект сканирования -->
        <div class="scanlines"></div>
        <div class="noise"></div>
        
        <!-- Огни внизу -->
        <div class="flames">
            <div class="flame flame-1"></div>
            <div class="flame flame-2"></div>
            <div class="flame flame-3"></div>
            <div class="flame flame-4"></div>
        </div>
        
        <!-- Заголовок -->
        <div class="title-container">
            <h1 class="main-title">RTK</h1>
            <div class="subtitle">THE FURY OF THE LAST LECTURER</div>
        </div>
        
        <!-- Кнопка играть -->
        <button class="play-button" id="playButton">ИГРАТЬ</button>
        
        <!-- Подвал -->
        <div class="footer">
            <span class="highlight">INSERT COIN</span> | 2026 | MEME EDITION | <span class="highlight">PRESS START</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const playButton = document.getElementById('playButton');
            
            // Эффект мигания "INSERT COIN"
            const highlights = document.querySelectorAll('.highlight');
            setInterval(() => {
                highlights.forEach(highlight => {
                    highlight.style.visibility = highlight.style.visibility === 'hidden' ? 'visible' : 'hidden';
                });
            }, 500);
            
            // Добавляем случайное мерцание заголовка
            const title = document.querySelector('.main-title');
            setInterval(() => {
                if (Math.random() > 0.7) {
                    title.style.animation = 'none';
                    setTimeout(() => {
                        title.style.animation = 'flicker 3s infinite alternate';
                    }, 100);
                }
            }, 3000);
            
            // Переход на страницу боя при клике
            playButton.addEventListener('click', function() {
                // Эффект нажатия кнопки
                this.style.transform = 'scale(0.95)';
                this.style.boxShadow = '0 0 10px rgba(255, 153, 0, 0.5)';
                
                // Задержка для анимации нажатия
                setTimeout(() => {
                    window.location.href = 'fight.html';
                }, 200);
            });
            
            // Переход на страницу боя при нажатии Enter или пробела
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    playButton.click();
                }
            });
        });
    </script>
</body>
</html>
